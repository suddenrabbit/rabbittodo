<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f8fa" data-light="#f8f8fa" data-dark="#14151a" />
  <script>
    (() => {
      const key = "rabbittodo-appearance-mode";
      const modes = ["system", "light", "dark"];
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      const root = document.documentElement;
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      const normalize = (value) => modes.includes(value) ? value : "system";
      const resolve = (mode) => mode === "system" ? (media.matches ? "dark" : "light") : mode;
      const apply = (value, persist = false) => {
        const mode = normalize(value);
        const scheme = resolve(mode);
        root.dataset.appearanceMode = mode;
        root.dataset.colorScheme = scheme;
        root.style.colorScheme = scheme;
        if (themeMeta) themeMeta.content = scheme === "dark" ? themeMeta.dataset.dark : themeMeta.dataset.light;
        if (persist) {
          try { localStorage.setItem(key, mode); } catch {}
        }
        return mode;
      };
      let stored = "system";
      try { stored = localStorage.getItem(key) || "system"; } catch {}
      window.RabbitToDoAppearance = { apply, current: () => normalize(root.dataset.appearanceMode) };
      apply(stored);
      const followSystem = () => {
        if (root.dataset.appearanceMode === "system") apply("system");
      };
      if (media.addEventListener) media.addEventListener("change", followSystem);
      else media.addListener(followSystem);
      window.addEventListener("storage", (event) => {
        if (event.key === key) apply(event.newValue || "system");
      });
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="RabbitToDo" />
  <title>RabbitToDo</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/rabbittodo-icon-dock-v4.png" />
  <link rel="icon" type="image/png" href="/rabbittodo-icon-dock-v4.png" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #f8f8fa; }
    html[data-color-scheme="dark"],
    html[data-color-scheme="dark"] body { background: #14151a; }
  </style>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/style-overrides.css" />
</head>
<body>
  <main id="app" class="app-shell"></main>
  <script src="/app.js" defer></script>
</body>
</html>
